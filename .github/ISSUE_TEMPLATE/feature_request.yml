name: Feature request
description: Suggest an idea or an app Nib should support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Nib to do?
      description: Describe the problem or the situation, then the idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered?
